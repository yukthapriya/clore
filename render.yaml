services:
  - type: web
    name: clore-tryon
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python tryon_server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: clore-web
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.20.4
      - key: PYTHON_SERVER_URL
        fromService:
          type: web
          name: clore-tryon
          property: hostport
      - key: VITE_GROQ_KEY
        sync: false
